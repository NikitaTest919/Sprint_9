name: UI Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.13

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pull Selenoid Chrome image
        run: docker pull selenoid/chrome:128.0

      - name: Start Selenoid
        run: docker run -d -p 4444:4444 --name selenoid -v /var/run/docker.sock:/var/run/docker.sock -v ${{ github.workspace }}/browser.json:/etc/selenoid/browsers.json aerokube/selenoid:latest-release

      - name: Run UI Tests
        run: pytest -q --alluredir=allure_results

      - name: Stop Selenoid
        run: docker stop selenoid && docker rm selenoid

      - name: Upload Allure Results
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure_results
