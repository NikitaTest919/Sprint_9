name: Run UI tests with Selenoid

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      docker:
        image: docker:24.0-dind
        privileged: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Compose
        run: |
          docker-compose -v

      - name: Start Selenoid (compose)
        run: |
          docker-compose up -d
      - name: Wait for selenoid
        run: |
          for i in {1..20}; do
            if curl -sS http://localhost:4444/status | jq .ready &>/dev/null; then break; fi
            sleep 2
          done

      - name: Build image with tests
        run: docker build -t foodgram-tests:latest .

      - name: Run tests in container
        run: |
          docker run --network host \
            -e SELENOID_URL=http://localhost:4444/wd/hub \
            -v ${{ github.workspace }}:/app \
            foodgram-tests:latest

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure_results
